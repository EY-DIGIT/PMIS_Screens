<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UIDAI PMIS – Reset Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>

<style>
:root{
  --navy:#0b3c88;
  --cyan:#0aa1c0;
  --border:#dbe5f1;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Inter,sans-serif;
}

/* HEADER */
.header{background:#fff;border-bottom:3px solid var(--navy);padding:10px 20px;display:flex;justify-content:space-between;align-items:center;}
.header img{height:40px}
.header strong{font-size:20px;font-weight:800;background:linear-gradient(90deg,var(--navy),var(--cyan));-webkit-background-clip:text;color:transparent;}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.header-left img{height:40px;}

.header-title{
  font-size:16px;
  font-weight:600;
  color:var(--navy);
}

.header-sub{
  font-size:12px;
  color:#555;
}

.header-right img{height:40px;}

/* BACKGROUND */
.main{
  position:relative;
  min-height:calc(100vh - 70px);
  background:url("background.jpg") center/cover no-repeat;
}

/* OVERLAY */
.overlay{
  position:absolute;
  inset:0;
  background:rgba(10,30,80,0.6);
  display:flex;
  justify-content:flex-end;
  align-items:center;
  padding:40px 60px;
}

/* CARD */
.card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:12px;
  padding:28px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* HEADER */
.card-head{
  text-align:center;
  margin-bottom:20px;
}

.required::after {
  content: " *";
  color: #dc2626;
  font-weight: 600;
}

.card-head img{
  width:50px;
  margin-bottom:8px;
}

.card-head h1{
  font-size:18px;
  color:var(--navy);
}

.sub{
  font-size:13px;
  color:#555;
}

/* FORM */
.field{margin-bottom:16px;}

label{
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
  display:block;
}

input{
  width:100%;
  padding:10px;
  border:1px solid var(--border);
  border-radius:6px;
  font-size:14px;
}

input:focus{
  outline:none;
  border-color:var(--cyan);
}

/* PASSWORD WRAPPER */
.password-wrapper{
  position:relative;
}

.password-wrapper input{
  padding-right:40px;
}

.eye{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  border:none;
  background:transparent;
  color:#6b7280;
  display:none;
  padding:4px;
  border-radius:4px;
}

.eye:hover{
  color:var(--navy);
  background:#f1f5f9;
}

.eye:focus{
  outline:2px solid var(--cyan);
  outline-offset:2px;
}

/* RULES */
.rules{
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:8px;
  padding:14px;
  margin-bottom:16px;
  padding-left:20px;
}

.rules li{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  margin-bottom:6px;
  color:#b91c1c;
}

.rules li.valid{
  color:#166534;
}

.icon{
  font-size:14px;
}

/* ERROR */
#confirmError{
  font-size:12px;
  color:#b91c1c;
  margin-top:5px;
  display:none;
}

#confirmError.valid{
  color:#166534;
}

/* BUTTON */
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:6px;
  background:linear-gradient(90deg,var(--navy),var(--cyan));
  color:#fff;
  font-weight:600;
  cursor:not-allowed;
  opacity:.6;
  transition:0.3s;
}

.btn.enabled{
  opacity:1;
  cursor:pointer;
}

.btn.enabled:hover{
  filter:brightness(1.1);
}

/* FOOTER */
.footer{
  text-align:center;
  font-size:11px;
  color:#888;
  margin-top:14px;
}
</style>
</head>

<body>

<div class="header">
  <img src="logo.avif">
  <div><strong>UIDAI Automation Governance Tool</strong></div>
  <img src="Government_of_India_logo.svg">
</div>

<div class="main">
  <div class="overlay">

    <div class="card">

      <div class="card-head">
        <img src="Aadhaar.png">
        <h1>Reset Password</h1>
        <div class="sub">Create a secure new password</div>
      </div>

      <!-- NEW PASSWORD -->
      <div class="field">
        <label class="required">New Password</label>
        <div class="password-wrapper">
          <input type="password" id="newpassword" placeholder="Enter New Password" required>

          <button type="button" class="eye" id="eye1" aria-label="Show password" aria-pressed="false">
            <svg id="eyeOpen1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
            </svg>
            <svg id="eyeClosed1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" style="display:none;">
              <path fill="currentColor" d="M2 5l17 17-1.5 1.5-3.2-3.2C13.5 20.8 12.8 21 12 21c-7 0-10-7-10-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <ul class="rules">
        <li id="r1"><span class="icon">❌</span> Minimum 12 characters</li>
        <li id="r2"><span class="icon">❌</span> Uppercase & lowercase letters</li>
        <li id="r3"><span class="icon">❌</span> At least 1 number</li>
        <li id="r4"><span class="icon">❌</span> At least 1 special character</li>
      </ul>

      <!-- CONFIRM PASSWORD -->
      <div class="field">
        <label class="required">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirmpassword" placeholder="Confirm Password" required>

          <button type="button" class="eye" id="eye2" aria-label="Show password" aria-pressed="false">
            <svg id="eyeOpen2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7z"/>
            </svg>
            <svg id="eyeClosed2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" style="display:none;">
              <path fill="currentColor" d="M2 5l17 17-1.5 1.5-3.2-3.2C13.5 20.8 12.8 21 12 21c-7 0-10-7-10-7z"/>
            </svg>
          </button>
        </div>

        <div id="confirmError">Passwords do not match</div>
      </div>

      <button id="resetBtn" class="btn">Reset Password</button>

      <div class="footer">
        © 2026 UIDAI · PMIS Automation Tool · Internal Use Only
      </div>

    </div>

  </div>
</div>

<script>
const pwd = document.getElementById('newpassword');
const confirmPwd = document.getElementById('confirmpassword');
const btn = document.getElementById('resetBtn');
const confirmError = document.getElementById('confirmError');

const eye1 = document.getElementById('eye1');
const eye2 = document.getElementById('eye2');
const eyeOpen1 = document.getElementById('eyeOpen1');
const eyeClosed1 = document.getElementById('eyeClosed1');
const eyeOpen2 = document.getElementById('eyeOpen2');
const eyeClosed2 = document.getElementById('eyeClosed2');

const rules = [
  { el: document.getElementById('r1'), test: v => v.length >= 12 },
  { el: document.getElementById('r2'), test: v => /[a-z]/.test(v) && /[A-Z]/.test(v) },
  { el: document.getElementById('r3'), test: v => /\d/.test(v) },
  { el: document.getElementById('r4'), test: v => /[^A-Za-z0-9]/.test(v) }
];

function updateRules(){
  const val = pwd.value;
  let validCount = 0;

  rules.forEach(r=>{
    const ok = r.test(val);
    r.el.classList.toggle('valid', ok);

    const icon = r.el.querySelector('.icon');
    icon.textContent = ok ? '✔' : '❌';

    if(ok) validCount++;
  });

  let match = false;

  if(confirmPwd.value.length > 0){
    confirmError.style.display = 'block';

    if(val === confirmPwd.value){
      confirmError.textContent = "Passwords match";
      confirmError.classList.add('valid');
      match = true;
    } else {
      confirmError.textContent = "Passwords do not match";
      confirmError.classList.remove('valid');
    }
  } else {
    confirmError.style.display = 'none';
  }

  if(validCount === 4 && match){
    btn.classList.add('enabled');
  } else {
    btn.classList.remove('enabled');
  }
}

/* SHOW EYE */
pwd.addEventListener('input', () => {
  eye1.style.display = pwd.value ? "block" : "none";
});

confirmPwd.addEventListener('input', () => {
  eye2.style.display = confirmPwd.value ? "block" : "none";
});

/* TOGGLE */
eye1.onclick = () => {
  const hidden = pwd.type === "password";
  pwd.type = hidden ? "text" : "password";
  eyeOpen1.style.display = hidden ? "none" : "block";
  eyeClosed1.style.display = hidden ? "block" : "none";
};

eye2.onclick = () => {
  const hidden = confirmPwd.type === "password";
  confirmPwd.type = hidden ? "text" : "password";
  eyeOpen2.style.display = hidden ? "none" : "block";
  eyeClosed2.style.display = hidden ? "block" : "none";
};

pwd.addEventListener('input', updateRules);
confirmPwd.addEventListener('input', updateRules);
</script>

</body>
</html>
