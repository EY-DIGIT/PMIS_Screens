<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>UIDAI PMIS – Reset Password Link</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>

<style>
:root{
  --navy:#0b3c88;
  --cyan:#0aa1c0;
  --border:#dbe5f1;
  --success:#16a34a;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Inter,sans-serif;
}

/* HEADER */
.header{background:#fff;border-bottom:3px solid var(--navy);padding:10px 20px;display:flex;justify-content:space-between;align-items:center;}
.header img{height:40px}
.header strong{font-size:20px;font-weight:800;background:linear-gradient(90deg,var(--navy),var(--cyan));-webkit-background-clip:text;color:transparent;}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.header-left img{height:40px;}

.header-title{
  font-weight:600;
  color:var(--navy);
  font-size:18px;
}

.header-right img{height:40px;}

/* MAIN */
.main{
  position:relative;
  height:calc(100vh - 70px);
  background:url("background.jpg") no-repeat center center/cover;
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(10,30,80,0.75);
  display:flex;
  justify-content:flex-end;
  align-items:center;
  padding:40px;
}

/* CARD */
.card{
  width:100%;
  max-width:380px;
  background:#fff;
  border-radius:12px;
  padding:26px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* TABS */
.tabs{
  display:flex;
  margin-bottom:16px;
  border:1px solid var(--border);
  border-radius:6px;
  overflow:hidden;
}

.tab{
  flex:1;
  text-align:center;
  padding:10px;
  cursor:pointer;
  font-weight:600;
  background:#f5f7fb;
}

.tab.active{
  background:linear-gradient(90deg,var(--navy),var(--cyan));
  color:#fff;
}

/* HEAD */
.card-head{
  text-align:center;
  margin-bottom:18px;
}

.card-head img{
  width:50px;
  margin-bottom:8px;
}

.card-head h1{
  font-size:18px;
  color:var(--navy);
}

.sub{
  font-size:13px;
  color:#555;
}

/* FORM */
.field{margin-bottom:14px;}

label{
  font-size:13px;
  font-weight:600;
  display:block;
  margin-bottom:5px;
}

input{
  width:100%;
  padding:10px;
  border:1px solid var(--border);
  border-radius:6px;
}

.required::after{
  content:" *";
  color:#dc2626;
}

/* PRIMARY BUTTON */
.btn-primary{
  width:100%;
  padding:12px;
  border:none;
  border-radius:6px;
  background:linear-gradient(90deg,var(--navy),var(--cyan));
  color:#fff;
  font-weight:600;
  margin-top:10px;
  cursor:pointer;
}

.btn-primary:disabled{
  opacity:0.5;
}

/* LINKS */
.links{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-top:12px;
}

.links a{
  color:var(--cyan);
  text-decoration:none;
}

/* FOOTER */
.footer{
  text-align:center;
  font-size:11px;
  margin-top:14px;
  color:#888;
}

/* RESPONSIVE */
@media(max-width:768px){
  .overlay{
    justify-content:center;
    padding:20px;
  }
}
</style>
</head>

<body>

<div class="header">
  <img src="logo.avif">
  <div><strong>UIDAI Automation Governance Tool</strong></div>
  <img src="Government_of_India_logo.svg">
</div>

<div class="main">
<div class="overlay">

<div class="card">

<div class="card-head">
  <img src="Aadhaar.png">
  <h1>UIDAI PMIS Reset Password Link</h1>
  <div class="sub">Authorized access only</div>
</div>

<div class="field">
  <label class="required">Username</label>
  <input type="text" id="email">
</div>

<button class="btn-primary" id="sendLinkBtn" disabled>Send Link</button>

<div class="links">
  <a href="#"></a>
  <a href="#">Help</a>
</div>

<div class="footer">
  © 2026 UIDAI · PMIS Automation Tool · Internal Use Only
</div>

</div>
</div>
</div>

<script>
const emailInput = document.getElementById('email');
const sendLinkBtn = document.getElementById('sendLinkBtn');

/* VALIDATION */
function validateEmail() {
  if (emailInput.value.trim() !== "") {
    sendLinkBtn.disabled = false;
  } else {
    sendLinkBtn.disabled = true;
  }
}

/* EVENT LISTENER */
emailInput.addEventListener('input', validateEmail);
</script>

</body>
</html>
