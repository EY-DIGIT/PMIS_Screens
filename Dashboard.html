<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard | UIDAI PMIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b3c88;
  --navy-deep:#062a63;
  --cyan:#0aa1c0;
  --green:#1a8a3d;
  --green-soft:#e7f7ec;
  --saffron:#d4440e;
  --amber:#b25900;
  --purple:#5e3fb1;
  --purple-soft:#efeafc;
  --light:#f4f7fb;
  --border:#dbe5f1;
  --border-soft:#e9eef6;
  --text:#1e2a3a;
  --text-soft:#5a6680;
  --text-muted:#7a869a;
  --stripe:linear-gradient(90deg,var(--navy),var(--cyan));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--light);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
button,input{font:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid #ffb300;outline-offset:2px;border-radius:4px}
.site-header{background:#fff;box-shadow:0 2px 8px rgba(11,60,136,.08);position:relative;z-index:5}
.site-header:after{content:"";display:block;height:4px;background:var(--stripe)}
.header-main{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:14px;
  align-items:center;
  padding:10px 20px;
  background:linear-gradient(90deg,#ffebc7 0%,#fff 45%,#fff 55%,#d7efd9 100%);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-logo{height:48px;width:48px;border-radius:50%;background:var(--stripe);color:#fff;display:grid;place-items:center;font-weight:900}
.brand-text{line-height:1.15;font-weight:800}
.brand-text span:first-child{color:var(--saffron);display:block}
.brand-text span:last-child{color:var(--green);display:block}
.header-title{text-align:center;color:var(--navy);font-size:20px;font-weight:900}
.authority{justify-self:end;font-weight:700;line-height:1.2}
.navbar{min-height:42px;background:#fafcfe;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.nav-left{width:240px;display:flex;gap:10px;justify-content:space-between;padding:6px 14px;border-right:1px solid var(--border)}
.top-action{border:0;background:transparent;color:var(--navy);font-weight:700;cursor:pointer;padding:6px 8px;border-radius:6px}
.top-action:hover{background:#eef6fb}
.profile{padding:0 18px;font-weight:900;color:var(--navy)}
.layout{display:flex;flex:1;min-height:0}
.sidebar{width:240px;background:#fff;border-right:1px solid var(--border);flex:0 0 auto;transition:width .2s ease;overflow:auto}
.sidebar.collapsed{width:72px}
.menu{padding:12px}
.menu-row,.view-tab{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  border:0;
  background:transparent;
  color:var(--text);
  text-align:left;
  cursor:pointer;
  padding:9px 10px;
  border-radius:6px;
  margin-bottom:4px;
}
.menu-row.active,.view-tab.active{background:var(--stripe);color:#fff}
.menu-row:hover,.view-tab:hover{background:#eef6fb}
.menu-row.active:hover,.view-tab.active:hover{background:var(--stripe)}
.nav-icon{width:18px;height:18px;flex:0 0 18px;border-radius:5px;border:2px solid currentColor;position:relative}
.nav-icon.dashboard:after{content:"";position:absolute;left:3px;right:3px;top:7px;border-top:2px solid currentColor}
.nav-icon.summary{border-radius:50%}
.nav-icon.project:after{content:"";position:absolute;left:3px;right:3px;top:4px;border-top:2px solid currentColor;box-shadow:0 4px 0 currentColor}
.nav-icon.org:before,.nav-icon.org:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:currentColor;top:4px}
.nav-icon.org:before{left:2px}.nav-icon.org:after{right:2px}
.nav-icon.box{border-radius:3px}
.submenu{padding-left:20px}
.submenu.collapsed{display:none}
.sidebar.collapsed .label,.sidebar.collapsed .chev,.sidebar.collapsed .submenu{display:none}
.sidebar.collapsed .menu-row,.sidebar.collapsed .view-tab{justify-content:center}
.chev{margin-left:auto;font-size:12px}
.content{flex:1;min-width:0;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:900;color:var(--navy);padding-left:14px;position:relative}
.page-title:before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:5px;border-radius:3px;background:var(--stripe)}
.primary-btn,.ghost-btn,.more-btn{
  border:1px solid var(--border);
  background:#fff;
  color:var(--navy);
  border-radius:7px;
  padding:7px 12px;
  font-size:12.5px;
  font-weight:800;
  cursor:pointer;
}
.primary-btn{background:var(--stripe);color:#fff;border:0}
.ghost-btn:hover,.more-btn:hover{background:#eef6fb;border-color:#c8d6ee}
.view{display:flex;flex-direction:column;gap:16px;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card,.project-head,.track-head{
  background:linear-gradient(180deg,#fff,#fbfdff);
  border:1px solid var(--border-soft);
  border-radius:12px;
  box-shadow:0 4px 14px rgba(11,60,136,.07);
  padding:18px;
  position:relative;
}
.card:before,.project-head:before,.track-head:before,.picker-card:before{
  content:"";
  position:absolute;
  top:-1px;
  left:-1px;
  right:-1px;
  height:4px;
  background:var(--stripe);
  border-radius:12px 12px 0 0;
}
.card-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--navy);font-weight:900;margin-bottom:14px}
.card-sub{margin-left:auto;color:var(--text-muted);font-size:11.5px;font-weight:500}
.card-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.card-tools label{font-size:11.5px;color:var(--text-muted);font-weight:900}
.card-tools select{border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--navy);font-size:12px;font-weight:800;padding:6px 8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kpi-grid{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:12px}
.kpi{
  background:#fff;
  border:1px solid var(--border-soft);
  border-radius:10px;
  padding:14px 14px 12px;
  box-shadow:0 2px 8px rgba(11,60,136,.05);
  text-align:left;
  position:relative;
  overflow:hidden;
}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cyan)}
.kpi.total:before{background:var(--navy)}
.kpi.completed:before{background:var(--green)}
.kpi.ontrack:before{background:var(--cyan)}
.kpi.delayed:before{background:var(--saffron)}
.kpi.pending:before{background:var(--purple)}
.kpi.clickable{cursor:pointer}
.kpi.clickable:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(11,60,136,.12);border-color:#c8d6ee}
.kpi-label{font-size:10.5px;color:var(--text-muted);font-weight:900;text-transform:uppercase;letter-spacing:.45px;line-height:1.25}
.kpi-value{font-size:27px;font-weight:900;color:var(--navy);line-height:1;margin-top:7px;font-variant-numeric:tabular-nums}
.kpi.completed .kpi-value{color:var(--green)}
.kpi.ontrack .kpi-value{color:var(--cyan)}
.kpi.delayed .kpi-value{color:var(--saffron)}
.kpi.pending .kpi-value{color:var(--purple)}
.kpi-foot{font-size:11px;color:var(--text-muted);margin-top:7px;line-height:1.35}
.click-note{font-size:10px;font-weight:800;color:var(--navy);margin-top:4px}
.donut-wrap{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.donut{width:190px;height:190px}
.legend{display:flex;flex-direction:column;gap:8px}
.legend-item{display:flex;align-items:center;gap:8px;background:#f8fbff;border-radius:6px;padding:7px 8px;font-size:12.5px}
.swatch{width:12px;height:12px;border-radius:3px;flex:0 0 12px}
.legend-name{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend-value{font-weight:900;color:var(--navy)}
.delay-list{display:flex;flex-direction:column;gap:8px}
.delay-row{
  display:grid;
  grid-template-columns:1fr 130px;
  gap:10px;
  align-items:center;
  border:0;
  background:#fff;
  text-align:left;
  border-radius:8px;
  padding:7px;
  cursor:pointer;
}
.delay-row:hover{background:#fff7f2}
.delay-name{font-size:12.5px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.delay-context{display:block;color:var(--text-muted);font-size:11px;font-weight:500;margin-top:2px}
.delay-meter{display:flex;align-items:center;gap:6px}
.delay-pill{font-size:10.5px;font-weight:900;color:var(--saffron);min-width:48px;text-align:right;white-space:nowrap}
.delay-track{flex:1;height:14px;background:#fdf3ee;border:1px solid #fae0d2;border-radius:4px;overflow:hidden;min-width:30px}
.delay-fill{height:100%;background:linear-gradient(90deg,#f08762,var(--saffron));border-radius:4px}
.actions{display:flex;justify-content:flex-end;margin-top:12px}
.signal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.signal-card{
  border:1px solid var(--border-soft);
  background:#fff;
  border-radius:10px;
  padding:12px;
  cursor:pointer;
  text-align:left;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.signal-card:hover{border-color:#c8d6ee;box-shadow:0 6px 16px rgba(11,60,136,.1)}
.signal-head{display:flex;justify-content:space-between;gap:8px}
.signal-name{font-weight:900;color:var(--navy)}
.signal-total{font-size:12px;font-weight:900;color:var(--text-muted);white-space:nowrap}
.signal-row{display:grid;grid-template-columns:84px 1fr 28px;gap:8px;align-items:center;font-size:11.5px;margin-top:7px}
.signal-row .bar{height:8px;background:#eef3fa;border-radius:4px;overflow:hidden}
.signal-row .bar div{height:100%;border-radius:4px}
.signal-row .num{text-align:right;font-weight:900;color:var(--navy)}
.picker-card{background:#fff;border:1px solid var(--border-soft);border-radius:12px;padding:14px 18px;box-shadow:0 4px 14px rgba(11,60,136,.07);position:relative}
.picker-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.picker-label{font-size:12px;font-weight:900;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px}
.combo{position:relative;flex:1;min-width:280px}
.combo-btn{width:100%;height:42px;border:1px solid var(--border);background:#fff;border-radius:8px;padding:0 12px;display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--text)}
.combo-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;font-weight:700}
.combo-menu{display:none;position:absolute;z-index:20;left:0;right:0;top:48px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 26px rgba(11,60,136,.16);padding:10px}
.combo.open .combo-menu{display:block}
.project-search,.list-search{width:100%;border:1px solid var(--border);border-radius:7px;padding:9px 10px;margin-bottom:8px}
.option-list{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.project-option{border:0;background:#fff;border-radius:7px;padding:9px 10px;text-align:left;cursor:pointer;color:var(--text)}
.project-option:hover,.project-option.active{background:#eef6fb}
.project-option-id{display:block;font-size:10.5px;font-weight:900;color:var(--text-muted)}
.project-option-name{display:block;font-weight:900;color:var(--navy);margin-top:2px}
.project-option-meta{display:block;font-size:11px;color:var(--text-muted);margin-top:2px}
.project-title{font-size:20px;font-weight:900;color:var(--navy);line-height:1.25;margin-top:3px}
.project-id{font-size:11px;font-weight:900;color:var(--text-muted);letter-spacing:.5px}
.project-desc{font-size:13px;color:var(--text-soft);margin-top:6px;line-height:1.45}
.project-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border-soft)}
.meta-item{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.meta-label{font-size:10.5px;color:var(--text-muted);font-weight:900;text-transform:uppercase}
.meta-value{font-weight:900;color:var(--navy)}
.progress-line{display:flex;align-items:center;gap:10px;margin-top:14px}
.progress-track{flex:1;min-width:140px;height:10px;background:#eef3fa;border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:var(--stripe);border-radius:5px}
.progress-pct{font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}
.project-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.project-card{border:1px solid var(--border-soft);background:#fff;border-radius:10px;padding:14px;text-align:left;cursor:pointer}
.project-card:hover{border-color:#c8d6ee;box-shadow:0 6px 16px rgba(11,60,136,.1)}
.project-card-id{font-size:10.5px;font-weight:900;color:var(--text-muted)}
.project-card-title{font-weight:900;color:var(--navy);margin-top:3px}
.project-card-meta{font-size:11.5px;color:var(--text-muted);margin-top:5px;line-height:1.45}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:900;white-space:nowrap}
.pill.completed{background:#e7f8ee;color:var(--green)}
.pill.ontrack{background:#e3eefc;color:var(--navy)}
.pill.delayed{background:#fde5d9;color:var(--saffron)}
.pill.active{background:#f0f2f7;color:var(--text-muted)}
.pill.pending{background:var(--purple-soft);color:var(--purple)}
.track-head-title{font-size:22px;font-weight:900;color:var(--navy)}
.track-sub{font-size:13px;color:var(--text-soft);margin-top:6px}
.track-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.track-table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;background:#fff}
.track-table{width:100%;border-collapse:separate;border-spacing:0;min-width:960px;font-size:13px}
.track-table th{background:linear-gradient(180deg,#3a6cb5,#2d5ba0);color:#fff;text-align:left;padding:13px 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.35px;white-space:nowrap}
.track-table td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
.track-table tbody tr td{cursor:pointer}
.track-table tbody tr td:last-child{cursor:default}
.track-table tbody tr:hover td{background:#e7f1ff}
.row-milestone td{background:#eef4fc}
.row-activity td{background:#f7fafe}
.wbs{font-family:Consolas,Menlo,monospace;font-weight:900;color:#2d5ba0;white-space:nowrap}
.track-name{font-weight:900;color:var(--navy)}
.row-activity .track-name{color:#0e6fa3;padding-left:14px}
.row-task .track-name{color:var(--cyan);padding-left:28px}
.track-context{display:block;font-size:11px;color:var(--text-muted);margin-top:2px}
.mini-progress{display:grid;grid-template-columns:1fr 38px;gap:8px;align-items:center;min-width:130px}
.mini-progress .bar{height:7px;background:#eef3fa;border-radius:4px;overflow:hidden}
.mini-progress .bar div{height:100%;background:var(--stripe);border-radius:4px}
.mini-progress .pct{font-size:11px;font-weight:900;color:var(--navy);text-align:right}
.date-cell{white-space:nowrap;font-variant-numeric:tabular-nums;color:#3d4c6b}
.type-pill{display:inline-block;background:#eef3fa;color:var(--navy);border-radius:9px;padding:3px 8px;font-size:11px;font-weight:900}
.pm-btn{border:1px solid var(--border);background:#fff;color:var(--navy);border-radius:7px;padding:5px 9px;font-size:11px;font-weight:900;cursor:pointer;white-space:nowrap}
.pm-btn:hover{background:#eef6fb;border-color:#c8d6ee}
.row-milestone .wbs,.row-milestone .track-name{font-weight:900}
.row-activity .wbs{padding-left:10px}
.row-task .wbs{padding-left:22px}
.row-subtask .wbs{padding-left:34px}
.row-subtask .track-name{color:#6b4fb7;padding-left:42px}
.empty{padding:34px 18px;text-align:center;color:var(--text-muted);line-height:1.55}
.site-footer{position:relative;background:linear-gradient(90deg,#eaf1fb,#f5f9fe,#eaf1fb);color:var(--navy);text-align:center;padding:10px 16px;font-size:12.5px;font-weight:700}
.site-footer:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--stripe)}
@media(max-width:1100px){.grid-2{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
@media(max-width:900px){
  .header-main{grid-template-columns:1fr;text-align:center}
  .brand{justify-content:center}.authority{justify-self:center;text-align:center}
  .layout{flex-direction:column}.sidebar,.sidebar.collapsed{width:100%;border-right:0;border-bottom:1px solid var(--border)}
  .sidebar.collapsed .label,.sidebar.collapsed .chev{display:inline}.sidebar.collapsed .menu-row,.sidebar.collapsed .view-tab{justify-content:flex-start}
  .menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.submenu{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding-left:0}
}
@media(max-width:560px){
  .content{padding:10px}.header-title{font-size:16px}.brand-logo{height:38px;width:38px}.nav-left{width:100%;border-right:0}
  .navbar{flex-wrap:wrap}.profile{padding:8px 14px}.card,.project-head,.track-head{padding:14px}.page-title{font-size:18px}
  .donut-wrap{grid-template-columns:1fr;justify-items:center}.legend{width:100%}
  .delay-row{grid-template-columns:1fr 100px}.delay-pill{min-width:40px;font-size:10px}.combo{min-width:200px}.combo-menu{position:fixed;left:10px;right:10px;top:auto;margin-top:6px}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-main">
    <div class="brand">
      <div class="brand-logo">AI</div>
      <div class="brand-text"><span>Mera Aadhaar</span><span>Meri Pehchaan</span></div>
    </div>
    <h1 class="header-title">UIDAI Automation Governance Tool</h1>
    <div class="authority">Unique Identification<br>Authority of India</div>
  </div>
</header>
<nav class="navbar" aria-label="Top navigation">
  <div class="nav-left">
    <button class="top-action" id="toggleBtn" type="button">Menu</button>
    <button class="top-action" type="button">Home</button>
  </div>
  <div class="profile">User</div>
</nav>
<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
    <nav class="menu">
      <button class="menu-row active" id="dashHead" type="button" aria-expanded="true">
        <span class="nav-icon dashboard"></span><span class="label">Dashboard</span><span class="chev">v</span>
      </button>
      <div class="submenu" id="dashSubmenu">
        <button class="view-tab active" type="button" data-view="summary"><span class="nav-icon summary"></span><span class="label">Summary</span></button>
        <button class="view-tab" type="button" data-view="project"><span class="nav-icon project"></span><span class="label">Project View</span></button>
        <button class="view-tab" type="button" data-view="org"><span class="nav-icon org"></span><span class="label">Organization View</span></button>
      </div>
      <button class="menu-row" type="button"><span class="nav-icon box"></span><span class="label">Project Management</span><span class="chev">></span></button>
      <button class="menu-row" type="button"><span class="nav-icon box"></span><span class="label">Master Data</span></button>
      <button class="menu-row" type="button"><span class="nav-icon box"></span><span class="label">Vendor Management</span><span class="chev">></span></button>
      <button class="menu-row" type="button"><span class="nav-icon box"></span><span class="label">User Management</span><span class="chev">></span></button>
    </nav>
  </aside>
  <main class="content">
    <div class="page-head">
      <div class="page-title" id="pageTitle">Dashboard</div>
      <button class="primary-btn" id="refreshBtn" type="button">Refresh</button>
    </div>
    <section class="view" id="view" aria-live="polite"></section>
  </main>
</div>
<footer class="site-footer">2026 UIDAI | PMIS Automation Tool | Internal Use Only</footer>
<script>
"use strict";
const TODAY = new Date("2026-05-08");
const DAY = 86400000;
const projects = [
  {
    id:"PRJ001", name:"Aadhaar Enrolment Portal Revamp",
    description:"Modernise the citizen-facing enrolment portal with new UX, mobile flows and operator console.",
    organisation:"EY", division:"TMD-I", owner:"R. Kumar", status:"PUBLISHED",
    plannedStart:"2026-01-05", plannedEnd:"2026-05-10", actualStart:"2026-01-05",

  if(projectList){ state.projectListMode = projectList.dataset.projectList; state.searchText = ""; state.view = "projects"; render(); return; }
  const openOrg = e.target.closest("[data-open-org]");
  if(openOrg){ state.org = openOrg.dataset.openOrg; state.view = "org"; render(); return; }
  const openDiv = e.target.closest("[data-open-division]");
  if(openDiv){ state.division = openDiv.dataset.openDivision; state.view = "division"; render(); return; }
  if(e.target.closest("[data-all-orgs]")){ state.showAllOrg = true; state.org = null; state.view = "org"; render(); return; }
  if(e.target.closest("[data-all-divisions]")){ state.showAllDivision = true; state.division = null; state.view = "division"; render(); return; }
  const backGroup = e.target.closest("[data-back-group]");
  if(backGroup){ if(backGroup.dataset.backGroup === "org") state.org = null; else state.division = null; render(); return; }
  if(e.target.closest("[data-back-track]")){ state.view = state.track && state.track.projectId ? "project" : "summary"; state.track = null; render(); return; }
  const pmOpen = e.target.closest("[data-pm-open]");
  if(pmOpen){
    e.stopPropagation();
    const target = {projectId:pmOpen.dataset.pmProject, nodeKey:pmOpen.dataset.pmKey, nodeKind:pmOpen.dataset.pmKind};
    sessionStorage.setItem("pmisTarget", JSON.stringify(target));
    const url = `Project Management.html?projectId=${encodeURIComponent(target.projectId)}&nodeKey=${encodeURIComponent(target.nodeKey)}&nodeKind=${encodeURIComponent(target.nodeKind)}#track`;
    window.open(url, "_blank");
    return;
  }
  const track = e.target.closest("[data-track-status],[data-track-project],[data-track-kind],[data-track-approval],[data-track-org],[data-track-division],[data-track-project-mode]");
  if(track){
    openTrack({
      status:track.dataset.trackStatus || null,
      projectId:track.dataset.trackProject || null,
      key:track.dataset.trackKey || null,
      kind:track.dataset.trackKind || null,
      approval:track.hasAttribute("data-track-approval"),
      org:track.dataset.trackOrg || null,
      division:track.dataset.trackDivision || null,
      projectMode:track.dataset.trackProjectMode || null,
      minDelay:track.dataset.trackMinDelay ? Number(track.dataset.trackMinDelay) : (track.dataset.trackStatus === "delayed" ? state.delayFilter : null)
    });
  }
});
document.addEventListener("change", e => {
  if(e.target.matches("[data-delay-filter]")){
    state.delayFilter = Number(e.target.value) || 5;
    if(state.view === "track" && state.track && state.track.status === "delayed"){
      state.track = {...state.track, minDelay:state.delayFilter};
    }
    render();
  }
});
document.addEventListener("input", e => {
  if(e.target.id === "projectSearch"){
    const q = e.target.value.toLowerCase();
    let shown = 0;
    document.querySelectorAll(".project-option[data-pick-project]").forEach(btn => {
      const hit = btn.textContent.toLowerCase().includes(q);
      btn.style.display = hit ? "" : "none";
      if(hit) shown++;
    });
    const empty = document.getElementById("noProjectMatch");
    if(empty) empty.style.display = shown ? "none" : "";
  }
  if(e.target.id === "projectListSearch"){
    state.searchText = e.target.value;
    render();
    setTimeout(() => {
      const input = document.getElementById("projectListSearch");
      if(input){ input.focus(); input.setSelectionRange(input.value.length,input.value.length); }
    }, 0);
  }
});
document.getElementById("refreshBtn").addEventListener("click", render);
render();
</script>
</body>
</html>
