<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>UIDAI Automation Governance Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>

<style>
:root{
  --navy:#0b3c88;
  --cyan:#0aa1c0;
  --border:#dbe5f1;
  --success:#16a34a;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Inter,sans-serif;
}

/* HEADER */
.header{background:#fff;border-bottom:3px solid var(--navy);padding:10px 20px;display:flex;justify-content:space-between;align-items:center;}
.header img{height:40px}
.header strong{font-size:20px;font-weight:800;background:linear-gradient(90deg,var(--navy),var(--cyan));-webkit-background-clip:text;color:transparent;}

/* MAIN */
.main{
  position:relative;
  height:calc(100vh - 70px);
  background:url("background.jpg") no-repeat center center/cover;
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(10,30,80,0.75);
  display:flex;
  justify-content:flex-end;
  align-items:center;
  padding:40px;
}

/* CARD */
.card{
  width:100%;
  max-width:380px;
  background:#fff;
  border-radius:12px;
  padding:26px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* (Tabs hidden, structure kept) */
.tabs{display:none;}

/* HEAD */
.card-head{
  text-align:center;
  margin-bottom:18px;
}

.card-head img{
  width:50px;
  margin-bottom:8px;
}

.card-head h1{
  font-size:18px;
  color:var(--navy);
}

.sub{
  font-size:13px;
  color:#555;
}

/* FORM */
.field{margin-bottom:14px; position:relative;}

label{
  font-size:13px;
  font-weight:600;
  display:block;
  margin-bottom:5px;
}

input{
  width:100%;
  padding:10px;
  border:1px solid var(--border);
  border-radius:6px;
}

.required::after{
  content:" *";
  color:#dc2626;
}

/* PASSWORD EYE */
.password-wrapper{
  position:relative;
}

.password-wrapper input{
  padding-right:40px;
}

.eye{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  border:none;
  background:transparent;
  color:#6b7280;
  display:none;
  padding:4px;
  border-radius:4px;
}

/* Hover */
.eye:hover{
  color:var(--navy);
  background:#f1f5f9;
}

/* Focus (keyboard accessibility) */
.eye:focus{
  outline:2px solid var(--cyan);
  outline-offset:2px;
}

/* SEND OTP BUTTON */
.btn-otp{
  width:100%;
  padding:11px;
  border:2px solid var(--cyan);
  background:#fff;
  color:var(--cyan);
  font-weight:600;
  border-radius:6px;
  cursor:pointer;
  transition:0.3s;
}

.btn-otp:hover{
  background:linear-gradient(90deg,var(--navy),var(--cyan));
  color:#fff;
  border-color:transparent;
}

/* SUCCESS MESSAGE */
.otp-msg{
  font-size:12px;
  color:var(--success);
  margin-top:6px;
  display:none;
}

/* PRIMARY BUTTON */
.btn-primary{
  width:100%;
  padding:12px;
  border:none;
  border-radius:6px;
  background:linear-gradient(90deg,var(--navy),var(--cyan));
  color:#fff;
  font-weight:600;
  margin-top:10px;
  cursor:pointer;
}

.btn-primary:disabled{
  opacity:0.5;
}

/* LINKS */
.links{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-top:12px;
}

.links a{
  color:var(--cyan);
  text-decoration:none;
}

/* FOOTER */
.footer{
  text-align:center;
  font-size:11px;
  margin-top:14px;
  color:#888;
}

/* RESPONSIVE */
@media(max-width:768px){
  .overlay{
    justify-content:center;
    padding:20px;
  }
}
</style>
</head>

<body>

<div class="header">
  <img src="logo.avif">
  <div><strong>UIDAI Automation Governance Tool</strong></div>
  <img src="Government_of_India_logo.svg">
</div>

<div class="main">
<div class="overlay">

<div class="card">

<div class="card-head">
  <img src="Aadhaar.png">
  <h1>UIDAI PMIS Secure Login</h1>
  <div class="sub">Authorized access only</div>
</div>

<!-- Tabs kept but hidden -->
<div class="tabs">
  <div class="tab active" id="userTab">User Login</div>
  <div class="tab" id="adminTab">Admin Login</div>
</div>

<div class="field">
  <label class="required">Username</label>
  <input type="text" id="username" placeholder="Enter Username">
</div>

<div class="password-wrapper">
  <label class="required">Password</label>
  <input type="password" id="password" placeholder="Enter Password">
  
  <button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false">
    <!-- Eye Open -->
    <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
      <path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
    </svg>

    <!-- Eye Closed -->
    <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" style="display:none;">
      <path fill="currentColor" d="M2 5l17 17-1.5 1.5-3.2-3.2C13.5 20.8 12.8 21 12 21c-7 0-10-7-10-7a17.6 17.6 0 0 1 5.2-6.1L.5 6.5 2 5zm10 2c5.5 0 8.7 4.5 9.7 6-.4.6-1.3 1.9-2.7 3.2l-1.5-1.5A5 5 0 0 0 12 7zm0 3a2 2 0 0 1 2 2c0 .3-.1.6-.2.9l-2.7-2.7c.3-.1.6-.2.9-.2z"/>
    </svg>
  </button>
</div>

<button class="btn-primary" id="loginBtn" disabled>Sign In</button>

<div class="links">
  <a href="#">Forgot Password?</a>
  <a href="#">Help</a>
</div>

<div class="footer">
  © 2026 UIDAI · PMIS Automation Tool · Internal Use Only
</div>

</div>
</div>
</div>

<script>
const username = document.getElementById('username');
const password = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const eye = document.getElementById('eye');

/* PASSWORD EYE LOGIC */
password.addEventListener('input', () => {
  eye.style.display = password.value ? "block" : "none";
});

eye.onclick = () => {
  const isHidden = password.type === "password";

  password.type = isHidden ? "text" : "password";

  document.getElementById("eyeOpen").style.display = isHidden ? "none" : "block";
  document.getElementById("eyeClosed").style.display = isHidden ? "block" : "none";

  eye.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
  eye.setAttribute("aria-pressed", isHidden ? "true" : "false");
};

/* VALIDATION */
function validate(){
  loginBtn.disabled = !(username.value && password.value);
}

username.addEventListener('input', validate);
password.addEventListener('input', validate);
</script>

</body>
</html>
